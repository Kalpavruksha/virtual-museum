<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #b8975a;
  --gold2: #e8c36a;
  --gold-glow: rgba(232, 195, 106, 0.35);
  --ink: #0b0a09;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: #e9e2d0;
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
canvas { display: block; }
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%);
}
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(8,7,6,.88);
  backdrop-filter: blur(8px);
  z-index: 10;
  transition: opacity .6s, visibility .6s;
}
.overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }
h1 {
  font: 600 clamp(2.2rem, 6vw, 4.2rem)/1 var(--serif);
  letter-spacing: .18em;
  color: var(--gold2);
  margin: 0 0 .4em;
  text-transform: uppercase;
}
.sub {
  font: 400 1.25rem var(--serif);
  color: var(--gold);
  letter-spacing: .12em;
  margin-bottom: 2rem;
}
button {
  font: 500 .85rem var(--sans);
  letter-spacing: .25em;
  text-transform: uppercase;
  color: var(--gold2);
  background: transparent;
  border: 1px solid var(--gold);
  padding: 1rem 2.2rem;
  cursor: pointer;
  transition: all .25s ease;
}
button:hover {
  background: var(--gold);
  color: var(--ink);
  box-shadow: 0 0 20px var(--gold-glow);
}
.keys {
  margin-top: 2rem;
  font-size: .8rem;
  letter-spacing: .1em;
  color: #8c8470;
}
#loading { z-index: 20; }
.bar {
  width: 260px;
  height: 2px;
  background: #2a261f;
  margin-top: 1rem;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  width: 40%;
  background: var(--gold2);
  animation: ld 1.2s infinite ease-in-out;
}
@keyframes ld {
  0% { margin-left: -40%; }
  100% { margin-left: 100%; }
}
#cross {
  position: fixed;
  left: 50%;
  top: 50%;
  width: 6px;
  height: 6px;
  margin: -3px;
  border-radius: 50%;
  background: rgba(232,195,106,.8);
  box-shadow: 0 0 8px rgba(232,195,106,0.6);
  z-index: 5;
  pointer-events: none;
}
#prompt {
  position: fixed;
  left: 50%;
  bottom: 12%;
  transform: translateX(-50%);
  font: 400 1.15rem var(--serif);
  letter-spacing: .1em;
  color: var(--gold2);
  background: rgba(12,10,8,.75);
  backdrop-filter: blur(6px);
  padding: .65rem 1.4rem;
  border: 1px solid rgba(184,151,90,.5);
  border-radius: 2px;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  z-index: 5;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
#minimap {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 5;
  opacity: .92;
  border: 1px solid rgba(184,151,90,0.4);
  background: rgba(14,12,10,0.85);
  box-shadow: 0 6px 20px rgba(0,0,0,0.7);
  border-radius: 4px;
}

/* Inspection Modal Panel */
#panel {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(5,4,3,.85);
  backdrop-filter: blur(10px);
  z-index: 15;
  padding: 1.5rem;
}
#panel.show { display: flex; animation: panelFade .28s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes panelFade {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
.card {
  position: relative;
  max-width: 860px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  background: #12100d;
  border: 1px solid var(--gold);
  box-shadow: 0 24px 64px rgba(0,0,0,0.85), 0 0 32px var(--gold-glow);
  padding: 2.2rem;
  display: flex;
  flex-direction: column;
}
.p-close-x {
  position: absolute;
  top: 14px;
  right: 16px;
  background: transparent;
  border: none;
  color: var(--gold);
  font-size: 1.4rem;
  padding: 4px 8px;
  cursor: pointer;
  line-height: 1;
}
.p-close-x:hover { color: #fff; background: transparent; box-shadow: none; }
.panel-grid {
  display: grid;
  grid-template-columns: 1fr 1.15fr;
  gap: 2rem;
  align-items: start;
}
@media (max-width: 768px) {
  .panel-grid { grid-template-columns: 1fr; }
}
.media-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #080706;
  border: 1px solid rgba(184,151,90,0.3);
  padding: 0.8rem;
  min-height: 220px;
}
#p-img {
  max-width: 100%;
  max-height: 380px;
  object-fit: contain;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.audio-player-wrap, .video-player-wrap {
  width: 100%;
  margin-top: 0.6rem;
}
.audio-player-wrap audio, .video-player-wrap video {
  width: 100%;
}
.info-col {
  display: flex;
  flex-direction: column;
}
.badges {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 0.8rem;
}
.badge {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 0.25rem 0.6rem;
  border: 1px solid var(--gold);
  color: var(--gold2);
  background: rgba(184,151,90,0.12);
}
.card h2 {
  font: 600 2.2rem var(--serif);
  color: var(--gold2);
  margin: 0 0 .3rem;
  line-height: 1.15;
}
#p-meta {
  font: italic 1.25rem var(--serif);
  color: var(--gold);
  margin-bottom: 1.2rem;
}
#p-desc {
  line-height: 1.7;
  color: #d8d0bd;
  font-size: 0.95rem;
  margin-bottom: 1.4rem;
}
#p-lic {
  font-size: .75rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #8c8470;
  margin-bottom: 1.6rem;
}
.card-actions {
  display: flex;
  gap: 1rem;
}
</style>
</head>
<body>
<div id="loading" class="overlay">
  <h1>Museum</h1>
  <div class="sub">preparing the galleries</div>
  <div class="bar"><i></i></div>
</div>
<div id="start" class="overlay">
  <h1>Virtual Museum</h1>
  <div class="sub">Four rooms · Art · Music · History</div>
  <button id="startBtn">Click to enter</button>
  <div class="keys">WASD / arrows move · Shift run · Mouse look · E inspect · Esc pause</div>
</div>
<div id="cross"></div>
<div id="prompt"></div>
<canvas id="minimap"></canvas>

<!-- Inspection Modal Panel -->
<div id="panel">
  <div class="card">
    <button id="p-x" class="p-close-x" title="Close (Esc)">✕</button>
    <div class="panel-grid">
      <div class="media-col">
        <img id="p-img" src="" alt="Artwork Preview" style="display:none;" />
        <div id="p-audio-wrap" class="audio-player-wrap" style="display:none;">
          <audio id="p-audio" controls></audio>
        </div>
        <div id="p-video-wrap" class="video-player-wrap" style="display:none;">
          <video id="p-video" controls playsinline></video>
        </div>
      </div>
      <div class="info-col">
        <div class="badges">
          <span id="p-type-badge" class="badge"></span>
          <span id="p-room-badge" class="badge"></span>
        </div>
        <h2 id="p-title"></h2>
        <div id="p-meta"></div>
        <div id="p-desc"></div>
        <div id="p-lic"></div>
        <div class="card-actions">
          <button id="p-close">Close (E / Esc)</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
