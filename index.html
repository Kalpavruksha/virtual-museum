<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Museum</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#b8975a;--gold2:#e8c36a;--ink:#0b0a09;--serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#e9e2d0;font-family:var(--sans)}
canvas{display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,7,6,.88);z-index:10;transition:opacity .6s}
.overlay.hide{opacity:0;pointer-events:none}
h1{font:600 clamp(2rem,6vw,4rem)/1 var(--serif);letter-spacing:.18em;color:var(--gold2);margin:0 0 .4em;text-transform:uppercase}
.sub{font:400 1.2rem var(--serif);color:var(--gold);letter-spacing:.12em;margin-bottom:2rem}
button{font:500 .85rem var(--sans);letter-spacing:.25em;text-transform:uppercase;color:var(--gold2);background:transparent;border:1px solid var(--gold);padding:1rem 2.2rem;cursor:pointer;transition:.25s}
button:hover{background:var(--gold);color:var(--ink)}
.keys{margin-top:2rem;font-size:.75rem;letter-spacing:.1em;color:#8c8470}
#loading{z-index:20}.bar{width:260px;height:2px;background:#2a261f;margin-top:1rem;overflow:hidden}.bar i{display:block;height:100%;width:40%;background:var(--gold2);animation:ld 1.2s infinite ease-in-out}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(232,195,106,.7);z-index:5;pointer-events:none}
#prompt{position:fixed;left:50%;bottom:14%;transform:translateX(-50%);font:400 1.15rem var(--serif);letter-spacing:.1em;color:var(--gold2);background:rgba(8,7,6,.6);padding:.6rem 1.2rem;border:1px solid rgba(184,151,90,.4);opacity:0;transition:opacity .2s;z-index:5;pointer-events:none}
#minimap{position:fixed;right:16px;bottom:16px;z-index:5;opacity:.9;border-radius:2px}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,4,3,.7);z-index:15}
#panel.show{display:flex}
.card{max-width:560px;margin:1rem;padding:2.2rem 2.4rem;background:#14110d;border:1px solid var(--gold)}
.card h2{font:600 2rem var(--serif);color:var(--gold2);margin:0 0 .3rem}#p-meta{font:italic 1.15rem var(--serif);color:var(--gold);margin-bottom:1.2rem}
#p-desc{line-height:1.65;color:#d8d0bd;margin-bottom:1.2rem}#p-lic{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#8c8470;margin-bottom:1.4rem}
</style></head><body>
<div id="loading" class="overlay"><h1>Museum</h1><div class="sub">preparing the galleries</div><div class="bar"><i></i></div></div>
<div id="start" class="overlay"><h1>Virtual Museum</h1><div class="sub">Four rooms · Art · Music · History</div><button id="startBtn">Click to enter</button>
<div class="keys">WASD / arrows move · Shift run · Mouse look · E inspect · Esc pause</div></div>
<div id="cross"></div><div id="prompt"></div><canvas id="minimap"></canvas>
<div id="panel"><div class="card"><h2 id="p-title"></h2><div id="p-meta"></div><div id="p-desc"></div><div id="p-lic"></div><button id="p-close">Close (E)</button></div></div>
<script type="module" src="/src/main.js"></script></body></html>
